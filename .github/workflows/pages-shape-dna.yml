name: Pages · Fixed Orientation + Surface Shape DNA
on:
  push:
    branches:
      - experiments/sprint14-shape-dna-fixed-orientation
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-phenotype.mjs
      - run: node scripts/check-shape-dna.mjs
      - name: Audit response degeneracy vs surface Shape-DNA
        run: node scripts/analyze-phenotype-degeneracy.mjs
      - run: node scripts/check-phase.mjs
      - run: npm run build
      - name: Verify SPA and prior discovery lab
        run: |
          test -f dist/index.html
          test -f dist/discovery/index.html
          grep -q '/MindeleevBolt01/assets/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
