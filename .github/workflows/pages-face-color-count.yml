name: Pages · Periodic Table Face Color Counts
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint35-face-color-count
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify face types and actual palette colors against rendered geometry
        run: node scripts/check-face-color-usage.mjs
      - name: Verify periodic numbering and ShapeDNA v2
        run: |
          node scripts/check-shapedna-v2.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-polytron-periodic.mjs
      - name: Verify the earlier Mutatron experiments
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
          node scripts/check-shape-equilibrium.mjs
          node scripts/check-rapier-picking.mjs
          node scripts/check-phase.mjs
      - name: Build site and ShapeDNA v2 phenotype atlas
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Verify shipped periodic color statistics and current atlas
        run: |
          test -f dist/index.html
          grep -r -q 'Colori usati' dist/assets/
          grep -r -q 'Tipi facce' dist/assets/
          grep -q '"version":2' dist/phenotype-atlas.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
