name: Pages · ShapeDNA v2 (Sprint 35 fix)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint35-shapedna-corrected
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: ShapeDNA v2 regression (invariance, duals, negative controls)
        run: node scripts/check-shapedna-v2.mjs
      - name: Existing ShapeDNA and periodic table regressions
        run: |
          node scripts/check-shape-dna.mjs
          node scripts/check-polytron-periodic.mjs
      - name: Physics and editors regressions
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
          node scripts/check-shape-equilibrium.mjs
          node scripts/check-rapier-picking.mjs
          node scripts/check-phase.mjs
      - name: Recompute phenotype atlas with ShapeDNA v2 and build site
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Verify ShapeDNA v2 artifacts
        run: |
          test -f dist/index.html
          grep -r -q 'Tavola periodica dei Polytroni' dist/assets/
          grep -q '"version":2' dist/phenotype-atlas.json
          grep -q 'centroid-projected polygon' dist/phenotype-atlas.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
