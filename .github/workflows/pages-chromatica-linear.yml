name: Pages · Chromatica Linear RGB (Sprint 38)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint38-chromatica-linear-threshold
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Enforce perceptual endpoint threshold 8 across 144 straight gradients and five quantizations
        run: node scripts/check-gradient-palettes.mjs
      - name: Preserve face color counts and geometrical matching from Sprint 36
        run: |
          node scripts/check-face-color-usage.mjs
          node scripts/check-geometry-equivalence.mjs
          node scripts/check-polytron-periodic.mjs
          node scripts/check-shapedna-v2.mjs
          node scripts/check-shape-dna.mjs
      - name: Preserve Mutatron and physics regressions
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
      - name: Build production site and ShapeDNA v2 phenotype atlas
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Check shipped linear Chromatica lab and intact periodic table
        run: |
          test -f dist/index.html
          grep -r -q 'Chromatica' dist/assets/
          grep -r -q 'Capovolto' dist/assets/
          grep -r -q 'Tavola periodica dei Polytroni' dist/assets/
          grep -q '"version":2' dist/phenotype-atlas.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
