name: Research · Conway energy algebra checks
on:
  push:
    branches:
      - research/session12-formal-energy-algebra
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify algebraic identities and three energy accounts
        run: node research/conway_energy_model.mjs
