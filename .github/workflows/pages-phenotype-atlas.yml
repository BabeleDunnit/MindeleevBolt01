name: Pages · Phenotype Atlas + Genetic Synthesis
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint15-phenotype-atlas-synthesis
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Validate previous mathematical experiments
        run: |
          node scripts/check-phenotype.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-phase.mjs
      - name: Generate and validate pilot phenotype atlas
        run: |
          node scripts/build-phenotype-atlas.mjs
          node scripts/check-atlas.mjs
      - run: npm run build
      - name: Verify SPA and atlases
        run: |
          test -f dist/index.html
          test -f dist/phenotype-atlas.json
          test -f dist/phenotype-atlas.csv
          test -f dist/discovery/index.html
          grep -q '/MindeleevBolt01/assets/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
