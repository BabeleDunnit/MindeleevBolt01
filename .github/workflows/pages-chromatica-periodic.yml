name: Pages · Chromatica in Polytron Periodic Table (Sprint 39)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint39-chromatica-periodic
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Chromatica 144 pairs, N distinct floating colors, no modulo and 3D geometry
        run: node scripts/check-chromatica-periodic.mjs
      - name: Chromatica lab and perceptual threshold regressions
        run: node scripts/check-gradient-palettes.mjs
      - name: Periodic catalog and ShapeDNA regressions
        run: |
          node scripts/check-face-color-usage.mjs
          node scripts/check-geometry-equivalence.mjs
          node scripts/check-polytron-periodic.mjs
          node scripts/check-shapedna-v2.mjs
          node scripts/check-shape-dna.mjs
      - name: Mutatron and physics regressions
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
          node scripts/check-shape-equilibrium.mjs
          node scripts/check-rapier-picking.mjs
          node scripts/check-phase.mjs
      - name: Generate phenotype atlas and build
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Check production bundle
        run: |
          test -f dist/index.html
          grep -r -q 'Chromatica · 144 gradienti' dist/assets/
          grep -r -q 'senza wrapping' dist/assets/
          grep -r -q 'Palette originali' dist/assets/
          grep -q '"version":2' dist/phenotype-atlas.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
