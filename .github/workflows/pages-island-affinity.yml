name: Pages · Island Affinity Lab (Sprint 26)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint26-island-affinity-lab
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Island spectral grammar and physical comparison regression
        run: node scripts/check-island-affinity.mjs
      - name: Existing reactor and polyhedron regressions
        run: |
          node scripts/check-musical-return.mjs
          node scripts/check-visible-polyhedra.mjs
          node scripts/check-phenotype.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-phase.mjs
      - name: Atlas generation and regression
        run: |
          node scripts/build-phenotype-atlas.mjs
          node scripts/check-atlas.mjs
      - run: npm run build
      - name: Verify published lab resources
        run: |
          test -f dist/index.html
          test -f dist/phenotype-atlas.json
          grep -r -q 'Island Affinity Reactor' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
