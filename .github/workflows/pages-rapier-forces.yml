name: Pages · Rapier Force Diagnostics (Sprint 30)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint30-force-diagnostics
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Diagnostic force channels and genetic compatibility
        run: node scripts/check-rapier-forces.mjs
      - name: Rapier selection and physics regressions
        run: |
          node scripts/check-rapier-picking.mjs
          node scripts/check-rapier-inspection.mjs
          node scripts/check-planar-rapier.mjs
          node scripts/check-island-affinity.mjs
          node scripts/check-visible-polyhedra.mjs
          node scripts/check-musical-return.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-phase.mjs
      - name: Atlas and production build
        run: |
          node scripts/build-phenotype-atlas.mjs
          node scripts/check-atlas.mjs
          npm run build
      - name: Confirm browser-facing diagnostics
        run: |
          test -f dist/index.html
          grep -r -q 'Diagnostica delle forze' dist/assets/
          grep -r -q 'Buffer Cubo' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
