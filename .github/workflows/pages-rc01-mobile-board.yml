name: Pages · Mindeleev RC01 Mobile Board
on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate/rc01-mobile-board
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: RC01 portrait board, touch controls, identities, capture physics
        run: node scripts/check-mindeleev-rc01.mjs
      - name: Spectral Futures regressions
        run: node scripts/check-mindeleev-spectral.mjs
      - name: Life WYSIWYG regressions
        run: node scripts/check-mindeleev-life.mjs
      - name: Periodic table and Chromatica regressions
        run: |
          node scripts/check-chromatica-periodic.mjs
          node scripts/check-gradient-palettes.mjs
          node scripts/check-polytron-periodic.mjs
          node scripts/check-face-color-usage.mjs
          node scripts/check-geometry-equivalence.mjs
          node scripts/check-shapedna-v2.mjs
          node scripts/check-shape-dna.mjs
      - name: Scene, physics and UI regressions
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
          node scripts/check-shape-equilibrium.mjs
          node scripts/check-rapier-picking.mjs
          node scripts/check-phase.mjs
      - name: Atlas and production build
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Validate production RC01 and preceding labs
        run: |
          test -f dist/index.html
          grep -r -q 'RELEASE CANDIDATE 01' dist/assets/
          grep -r -q 'MINDELEEV' dist/assets/
          grep -r -q 'Conway DNA' dist/assets/
          grep -r -q 'idxInRing' dist/assets/
          grep -r -q 'SPECTRAL FUTURES' dist/assets/
          grep -r -q 'Energia intrinseca' dist/assets/
          test -f dist/phenotype-atlas.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
