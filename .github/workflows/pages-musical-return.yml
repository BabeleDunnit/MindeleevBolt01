name: Pages · Musical Return Reactor (Sprint 18)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint18-musical-return-reactor
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Four musical return experiments
        run: node scripts/check-musical-return.mjs
      - name: Existing experimental regressions
        run: |
          node scripts/check-phenotype.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-phase.mjs
      - name: Build Shape-DNA catalog
        run: |
          node scripts/build-phenotype-atlas.mjs
          node scripts/check-atlas.mjs
      - run: npm run build
      - name: Check Pages assets
        run: |
          test -f dist/index.html
          test -f dist/discovery/index.html
          test -f dist/phenotype-atlas.json
          grep -q '/MindeleevBolt01/assets/' dist/index.html
          grep -r -q 'Musical Return Reactor' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
