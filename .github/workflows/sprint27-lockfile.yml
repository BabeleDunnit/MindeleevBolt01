name: Sprint 27 dependency lock sync
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint27-planar-rapier
    paths:
      - package.json
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned Rapier package in lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the same research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sprint27): synchronize Rapier npm lockfile"
            git push
          fi
