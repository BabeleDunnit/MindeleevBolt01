name: Pages · Orbital Mutatron (Sprint 34)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint34-orbital-mut
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Orbital mechanics and transformation tests
        run: node scripts/check-orbital-mut.mjs
      - name: Stable Mutatron regressions
        run: |
          node scripts/check-multi-inspector.mjs
          node scripts/check-hex-editor.mjs
          node scripts/check-live-controls.mjs
          node scripts/check-shape-equilibrium.mjs
          node scripts/check-rapier-picking.mjs
          node scripts/check-shape-dna.mjs
      - name: Build application
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Check shipped orbital UI
        run: |
          test -f dist/index.html
          grep -r -q 'Orbital Mutatron' dist/assets/
          grep -r -q 'Rivoluzioni attorno al transformer' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
