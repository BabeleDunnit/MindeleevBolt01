name: Pages · Live Mutatron Controls (Sprint 32)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint32-live-controls
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Live controls preserve active physical state
        run: node scripts/check-live-controls.mjs
      - name: Shape-DNA physical equilibrium regression
        run: node scripts/check-shape-equilibrium.mjs
      - name: Core physics, picking and DNA regressions
        run: |
          node scripts/check-rapier-picking.mjs
          node scripts/check-shape-dna.mjs
          node scripts/check-phase.mjs
      - name: Build application
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Verify browser-facing UI
        run: |
          test -f dist/index.html
          grep -r -q 'Configurazione in diretta' dist/assets/
          grep -r -q 'Rilancia / Ripeti' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
