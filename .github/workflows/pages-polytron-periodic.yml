name: Pages · Polytron Periodic Table (Sprint 35)
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/sprint35-periodic-table
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mindeleev-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase-lab
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify periodic numbering and ShapeDNA equivalence
        run: node scripts/check-polytron-periodic.mjs
      - name: Verify existing numbering and physics
        run: |
          node scripts/check-orbital-mut.mjs
          node scripts/check-multi-inspector.mjs
          node scripts/check-live-controls.mjs
      - name: Production build
        run: |
          node scripts/build-phenotype-atlas.mjs
          npm run build
      - name: Check periodic table in output
        run: |
          test -f dist/index.html
          grep -r -q 'Tavola periodica dei Polytroni' dist/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
